name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12' # We stick to 3.12 or 3.11 for better PyInstaller compatibility, though you can use 3.13 if needed.

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller==6.11.0 # Or whichever latest stable you have

    - name: Install Project Requirements
      run: |
        pip install -r requirements.txt
        
    - name: Build with PowerShell Script
      shell: powershell
      run: .\build_exe.ps1

    - name: Upload dist folder
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist
        retention-days: 7
